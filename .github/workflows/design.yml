name: design

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Design rules gate
        # Fails on accessibility, motion and dialog rules. Hardcoded hex is
        # tracked separately with documented exemptions (generated/print output).
        run: npm run design:lint -- --gate

      - name: ESLint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Type-check and build
        run: npm run build

      - name: Bundle budget
        run: npm run build:budget

      - name: Tests
        run: npm test
