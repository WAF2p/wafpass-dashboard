name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "New version: $TAG"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ""

      # ── Generate SBOMs (CNCF requirement) ─────────────────────────────────────
      - name: Generate CycloneDX SBOM
        run: npx @cyclonedx/cyclonedx-npm@1 --output-file sbom.cyclonedx.json

      - name: Install Syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SPDX SBOM
        run: syft file:package-lock.json -o spdx-json=sbom.spdx.json

      - name: Generate license report
        run: npx license-checker --json --out licenses.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wafpass-dashboard-sbom
          path: |
            sbom.cyclonedx.json
            sbom.spdx.json
            licenses.json

      # ── Attest build provenance (CNCF / GitHub) ───────────────────────────────
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            sbom.cyclonedx.json
            sbom.spdx.json
            licenses.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:              ${{ steps.ver.outputs.tag }}
          name:                  WAF++ PASS Dashboard ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            sbom.cyclonedx.json
            sbom.spdx.json
            licenses.json
