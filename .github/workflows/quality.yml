name: quality

# Accessibility runs on every PR against a full local stack. Visual regression
# stays manual because baselines are environment-specific; use
# workflow_dispatch with a deployment URL to run it.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      web_url:
        description: External dashboard URL (skip the local stack)
        required: false
        default: ""
      admin_password:
        description: Admin password for an external deployment
        required: false
        default: ""

permissions:
  contents: read

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4
        with:
          path: dashboard

      - name: Checkout server
        uses: actions/checkout@v4
        with:
          repository: wombat-gov/wombat-server
          path: wafpass-server

      - name: Checkout wombat-core (controls and assets)
        uses: actions/checkout@v4
        with:
          repository: wombat-gov/wombat-core
          path: pass

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Start local stack
        if: ${{ !inputs.web_url }}
        run: docker compose -f dashboard/e2e/docker-compose.e2e.yml up -d --build --wait

      - id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Accessibility (axe)
        working-directory: dashboard
        env:
          WAF_WEB_URL: ${{ inputs.web_url || 'http://localhost:3000' }}
          WAF_ADMIN_PASSWORD: ${{ inputs.admin_password || 'e2e-admin-password' }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run a11y:check

      - name: Visual regression (manual external environments only)
        if: ${{ inputs.web_url }}
        working-directory: dashboard
        env:
          WAF_WEB_URL: ${{ inputs.web_url }}
          WAF_ADMIN_PASSWORD: ${{ inputs.admin_password }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run visual:check

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            dashboard/.a11y/report.json
            dashboard/.visual/diffs/
          if-no-files-found: ignore

      - name: Stop local stack
        if: always() && !inputs.web_url
        run: docker compose -f dashboard/e2e/docker-compose.e2e.yml down -v
