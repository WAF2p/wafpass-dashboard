server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 10M;
    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy — forward versioned API and root metadata to wombat-server ────
    # All API routes are under /api/v1; /api catches them all.
    location /api            { proxy_pass http://wombat-server:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /health         { proxy_pass http://wombat-server:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /version        { proxy_pass http://wombat-server:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /framework-update-info.yml { proxy_pass http://wombat-server:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }

    # ── Cache policy ───────────────────────────────────────────────────────────
    # index.html must never be cached, otherwise a rebuilt bundle keeps serving
    # stale hashed asset references. Hashed assets are immutable.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files /index.html =404;
    }
    location = / {
        add_header Cache-Control "no-store, must-revalidate";
        try_files /index.html =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback — serve index.html for all non-API routes ─────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
