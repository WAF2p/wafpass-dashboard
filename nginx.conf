server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy — forward all backend paths to wafpass-server ────────────────
    location /auth      { proxy_pass http://wafpass-server:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /runs      { proxy_pass http://wafpass-server:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /controls  { proxy_pass http://wafpass-server:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /waivers   { proxy_pass http://wafpass-server:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /risks     { proxy_pass http://wafpass-server:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /sandbox   { proxy_pass http://wafpass-server:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /scan      { proxy_pass http://wafpass-server:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /health    { proxy_pass http://wafpass-server:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /projects  { proxy_pass http://wafpass-server:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /sso       { proxy_pass http://wafpass-server:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /evidence  { proxy_pass http://wafpass-server:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }

    # ── SPA fallback — serve index.html for all non-API routes ─────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
