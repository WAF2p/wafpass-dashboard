server {
    listen 80;
    server_name _;
    client_max_body_size 10M;
    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy — forward versioned API and root metadata to wafpass-server ────
    # All API routes are under /api/v1; /api catches them all.
    location /api            { proxy_pass http://wafpass-server:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /health         { proxy_pass http://wafpass-server:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /version        { proxy_pass http://wafpass-server:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /framework-update-info.yml { proxy_pass http://wafpass-server:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }

    # ── SPA fallback — serve index.html for all non-API routes ─────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
